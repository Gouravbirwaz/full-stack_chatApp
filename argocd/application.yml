apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-chatapp
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/LondheShubham153/full-stack_chatApp.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: chat-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

